# Deployment для Задания 2
# Основной контейнер (nginx) стартует ТОЛЬКО после того, как init-контейнер
# успешно завершится. Init-контейнер (busybox) в цикле пытается разрезолвить
# по DNS сервис nginx-init-service. Пока сервиса не существует —
# nslookup ничего не находит, init-контейнер повторяет попытку каждые
# 2 секунды и под "зависает" в статусе Init:0/1 / PodInitializing.
# Как только Service будет создан — проверка отработает успешно,
# init-контейнер завершится, и стартует основной контейнер nginx.
#
# ВАЖНЫЙ НЮАНС (обнаружен на практике):
# Полагаться на КОД ВОЗВРАТА самого nslookup из BusyBox ненадёжно:
# он параллельно резолвит и A-, и AAAA-записи, а AAAA для ClusterIP-сервиса
# не существует, из-за чего exit code может быть ненулевым, даже когда
# нужная A-запись уже успешно найдена и видна в выводе команды.
# Поэтому проверка сделана иначе: результат nslookup построчно ищется
# через grep на строку вида "Address: <IPv4>" без порта (такая строка
# появляется в выводе ТОЛЬКО когда имя реально зарезолвилось в адрес;
# сервер DNS в первой строке вывода имеет вид "Address: X.X.X.X:53" —
# с портом — и этот шаблон не совпадает благодаря "$" в конце regex).
# Именно grep, а не nslookup, определяет успех/неудачу итерации цикла.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init-app
  template:
    metadata:
      labels:
        app: nginx-init-app
    spec:
      initContainers:
        - name: wait-for-service        # Init-контейнер — "сторож", блокирующий запуск основного
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Ожидаем появления сервиса nginx-init-service...";
              until nslookup nginx-init-service 2>/dev/null | grep -qE 'Address: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; do
                echo "Сервис ещё не найден, повтор через 2 секунды...";
                sleep 2;
              done;
              echo "Сервис найден! Запускаем основной контейнер.";

      containers:
        - name: nginx                   # Основной контейнер — стартует только после успеха init-контейнера
          image: nginx
          ports:
            - containerPort: 80
